server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: try file, then directory, then index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: serve well-known paths without logging as errors
    location = /.well-known/appspecific/com.chrome.devtools.json {
        log_not_found off;
        access_log off;
        return 404;
    }

    # Static assets - default handling is fine, but keep explicit for clarity
    location /assets/ {
        try_files $uri =404;
    }
}

