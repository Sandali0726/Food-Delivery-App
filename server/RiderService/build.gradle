protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.3"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().forEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

tasks.named('bootBuildImage') {
    runImage = 'paketobuildpacks/ubuntu-noble-run:latest'
}

bootJar {
    enabled = true
    archiveClassifier = ''
    mainClass = 'com.example.riderservice.RiderServiceApplication'
    manifest {
        attributes(
            'Main-Class': 'org.springframework.boot.loader.launch.JarLauncher',
            'Start-Class': 'com.example.riderservice.RiderServiceApplication'
        )
    }
}

// Ensure the regular jar task is disabled to avoid conflicts
jar {
    enabled = false
    archiveClassifier = ''
}

tasks.named('test') {
    useJUnitPlatform()
}
