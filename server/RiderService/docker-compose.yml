version: '3.8'

services:
  rider-service:
    build:
      context: .
      dockerfile: src/Docker/Dockerfile
    container_name: rider-service
    ports:
      - "8080:8080"
      - "9091:9091"
    environment:
      # Database configuration
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/riderdb
      - SPRING_DATASOURCE_USERNAME=rideruser
      - SPRING_DATASOURCE_PASSWORD=riderpass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver

      # JPA configuration
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect

      # Kafka configuration
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=delivery-service-group
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest

      # gRPC configuration
      - GRPC_SERVER_PORT=9091
      - GRPC_SERVER_SECURITY_ENABLED=false

      # Email configuration (using your existing config)
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=gayashankavishka2@gmail.com
      - SPRING_MAIL_PASSWORD=pvfo dluq gcis rzgr

      # Cloudinary configuration (using your existing config)
      - CLOUDINARY_CLOUD_NAME=dvsmpntdf
      - CLOUDINARY_API_KEY=637365868341956
      - CLOUDINARY_API_SECRET=MJz5bVWwclJNAbKc5_DC9qX9sL0

      # gRPC client configuration
      - GRPC_CLIENT_USER_SERVICE_ADDRESS=static://user-service:8082
    depends_on:
      - postgres
      - kafka
    networks:
      - yumy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: rider-postgres
    environment:
      - POSTGRES_DB=riderdb
      - POSTGRES_USER=rideruser
      - POSTGRES_PASSWORD=riderpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yumy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideruser -d riderdb"]
      interval: 30s
      timeout: 10s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: rider-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - yumy-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: rider-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - yumy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  yumy-network:
    driver: bridge
