syntax = "proto3";

package customer;

option java_multiple_files = true;
option java_package = "com.example.grpc.customer";
option java_outer_classname = "CustomerProto";

service CustomerService {
  rpc GetCustomerDetails (CustomerDetailsRequest)
      returns (CustomerDetailsResponse);
}

message CustomerDetailsRequest {
  string customer_email = 1;
}

message CustomerDetailsResponse {
  string customer_name = 1;
  string customer_phone = 2;
}
