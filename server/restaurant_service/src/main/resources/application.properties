spring.application.name=restaurant_service

server.port=8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update


# HikariCP Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=20000

# Clodinary Settings

cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_SECRET}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

#jwt secret key
jwt.secret=${JWT_SECRET}

# Enable debug logs for Spring Security to help diagnose 401/403 issues (temporary)
logging.level.org.springframework.security=DEBUG


# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lvishmitha75@gmail.com
spring.mail.password=${E_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=restaurant-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Trust all packages for JSON deserialization (adjust to specific packages for production)
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# If producer does not set type information in headers, force JsonDeserializer to use this default target type
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.restaurant_service.dto.OrderPlacedEvent
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# gRPC server port (separate from Kafka broker port to prevent protocol clashes)
grpc.server.port=9091

grpc.client.customer-service.address=dns:///10.20.11.237:9090
grpc.client.customer-service.negotiationType=PLAINTEXT

# Rider gRPC client configuration
rider.grpc.host=10.20.11.67
rider.grpc.port=9091
rider.grpc.timeout-ms=2000
